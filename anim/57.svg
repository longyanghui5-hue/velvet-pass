<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f0f4ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9cc" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffe9cc" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1000" height="1000"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <image xlink:href="https://cdn.jsdelivr.net/gh/longyanghui5-hue/velvet-pass@main/images/57.jpg" href="https://cdn.jsdelivr.net/gh/longyanghui5-hue/velvet-pass@main/images/57.jpg" x="0" y="0" width="1000" height="1000" preserveAspectRatio="xMidYMid slice"/>
    <ellipse cx="500" cy="500" rx="430" ry="430" fill="url(#glow)">
      <animate attributeName="opacity" values="0.18;0.34;0.18" dur="3.6s" repeatCount="indefinite"/>
    </ellipse>
    <g transform="rotate(22 500 500)">
      <rect x="0" y="280" width="320" height="440" fill="url(#sweep)">
        <animateTransform attributeName="transform" type="translate" values="-460 0; 1380 0" dur="5.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <circle cx="220" cy="300" r="2.4" fill="#eaf2ff">
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="0.6;3.0;0.6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="680" r="2.0" fill="#fff1d6">
      <animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="r" values="0.5;2.6;0.5" dur="3.1s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="260" r="1.8" fill="#ffffff">
      <animate attributeName="opacity" values="0;0.9;0" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
